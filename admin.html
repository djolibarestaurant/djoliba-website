<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DJOLIBA — Menu Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red:#C5192D;--red-dark:#8B0F1E;--gold:#F0A500;--gold-light:#FFD166;
    --green:#1A7A4A;--green-light:#2BAE6B;--cream:#FFF8EE;--dark:#0F0A05;
    --dark-mid:#1C1208;--dark-warm:#2A1A0A;--card:#221508;
    --border:rgba(240,165,0,0.12);--text:#F5E8D0;--muted:#A89070;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:'Outfit',sans-serif;background:var(--dark);color:var(--text);min-height:100vh}
  ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--dark)}::-webkit-scrollbar-thumb{background:var(--gold);border-radius:3px}

  /* LOGIN */
  #loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse 80% 60% at 50% 40%,rgba(197,25,45,0.15) 0%,transparent 70%),var(--dark);padding:2rem}
  .login-box{background:var(--dark-warm);border:1px solid var(--border);border-radius:16px;padding:3rem 2.5rem;width:100%;max-width:420px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,0.6)}
  .login-logo{font-family:'Bebas Neue',sans-serif;font-size:3rem;letter-spacing:0.12em;color:var(--gold);margin-bottom:0.3rem}
  .login-sub{font-size:0.8rem;color:var(--muted);letter-spacing:0.15em;text-transform:uppercase;margin-bottom:2.5rem}
  .login-input{width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:var(--text);padding:1rem 1.2rem;border-radius:8px;font-size:1rem;font-family:'Outfit',sans-serif;outline:none;transition:border 0.2s;text-align:center;letter-spacing:0.1em;margin-bottom:1rem}
  .login-input:focus{border-color:var(--gold)}
  .login-btn{width:100%;background:var(--gold);color:var(--dark);border:none;padding:1rem;border-radius:8px;font-size:1rem;font-weight:700;font-family:'Outfit',sans-serif;cursor:pointer;letter-spacing:0.08em;text-transform:uppercase;transition:all 0.2s}
  .login-btn:hover{background:var(--gold-light);transform:translateY(-1px)}
  .login-error{display:none;color:#ff6b6b;font-size:0.82rem;margin-top:0.8rem;background:rgba(197,25,45,0.1);border:1px solid rgba(197,25,45,0.2);padding:0.6rem 1rem;border-radius:6px}
  .login-hint{font-size:0.75rem;color:var(--muted);margin-top:1.5rem;line-height:1.6}

  /* DASHBOARD */
  #dashboard{display:none}
  .topbar{background:var(--dark-mid);border-bottom:1px solid var(--border);padding:0 2rem;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
  .topbar-logo{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:0.12em;color:var(--gold)}
  .topbar-badge{background:rgba(240,165,0,0.1);border:1px solid rgba(240,165,0,0.2);color:var(--gold);font-size:0.65rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;padding:0.25rem 0.7rem;border-radius:100px}
  .topbar-right{display:flex;align-items:center;gap:1rem}
  .topbar-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:0.5rem 1rem;border-radius:6px;font-size:0.8rem;font-family:'Outfit',sans-serif;cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:6px;transition:all 0.2s}
  .topbar-btn:hover{border-color:var(--gold);color:var(--gold)}
  .logout-btn{background:rgba(197,25,45,0.15);border:1px solid rgba(197,25,45,0.3);color:#ff6b6b;padding:0.5rem 1rem;border-radius:6px;font-size:0.8rem;font-family:'Outfit',sans-serif;cursor:pointer;transition:all 0.2s}
  .logout-btn:hover{background:var(--red);color:white;border-color:var(--red)}

  /* MAIN */
  .main{max-width:1200px;margin:0 auto;padding:2rem}

  /* STATS */
  .stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:2rem}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:1.2rem 1.5rem;display:flex;align-items:center;gap:1rem}
  .stat-icon{font-size:1.8rem;flex-shrink:0}
  .stat-num{font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--gold);line-height:1}
  .stat-label{font-size:0.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;margin-top:2px}

  /* ACTION BAR */
  .action-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem}
  .action-bar h2{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:0.1em;color:var(--cream)}
  .action-bar-left{display:flex;align-items:center;gap:0.8rem;flex-wrap:wrap}
  .action-bar-right{display:flex;gap:0.8rem}
  .cat-filter{display:flex;gap:0.4rem;flex-wrap:wrap}
  .cat-btn{background:transparent;border:1px solid rgba(255,255,255,0.1);color:var(--muted);padding:0.3rem 0.8rem;border-radius:100px;font-size:0.75rem;font-family:'Outfit',sans-serif;cursor:pointer;transition:all 0.2s}
  .cat-btn.active,.cat-btn:hover{background:var(--red);border-color:var(--red);color:white}
  .add-btn{background:var(--green);color:white;border:none;padding:0.65rem 1.2rem;border-radius:8px;font-size:0.85rem;font-weight:700;font-family:'Outfit',sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.2s;white-space:nowrap}
  .add-btn:hover{background:var(--green-light)}
  .save-btn{background:var(--gold);color:var(--dark);border:none;padding:0.65rem 1.4rem;border-radius:8px;font-size:0.85rem;font-weight:700;font-family:'Outfit',sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.2s;white-space:nowrap}
  .save-btn:hover{background:var(--gold-light)}

  /* MENU GRID */
  .menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.2rem}
  .item-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:border-color 0.2s}
  .item-card:hover{border-color:rgba(240,165,0,0.3)}

  /* IMAGE AREA */
  .item-img-area{height:180px;position:relative;overflow:hidden;background:var(--dark-warm);cursor:pointer}
  .item-img-area img{width:100%;height:100%;object-fit:cover;transition:transform 0.4s}
  .item-card:hover .item-img-area img{transform:scale(1.04)}
  .img-overlay{position:absolute;inset:0;background:rgba(0,0,0,0);display:flex;align-items:center;justify-content:center;transition:all 0.3s;opacity:0}
  .item-img-area:hover .img-overlay{background:rgba(0,0,0,0.6);opacity:1}
  .img-overlay-text{color:white;font-size:0.85rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;text-align:center;line-height:1.6}
  .img-overlay-text span{font-size:1.8rem;display:block;margin-bottom:4px}

  /* Upload progress */
  .upload-progress{position:absolute;bottom:0;left:0;right:0;height:4px;background:rgba(255,255,255,0.1)}
  .upload-progress-bar{height:100%;background:var(--gold);width:0%;transition:width 0.3s}

  .item-card-cat{position:absolute;top:8px;left:8px;background:rgba(0,0,0,0.7);backdrop-filter:blur(6px);color:var(--gold);font-size:0.62rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;padding:3px 8px;border-radius:2px}
  .delete-btn-img{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:6px;border:none;cursor:pointer;font-size:0.8rem;display:flex;align-items:center;justify-content:center;background:rgba(197,25,45,0.9);color:white;transition:all 0.2s;opacity:0}
  .item-img-area:hover .delete-btn-img{opacity:1}
  .delete-btn-img:hover{background:var(--red)}

  /* Hidden file input */
  .file-input{display:none}

  /* CARD BODY */
  .item-card-body{padding:1.2rem}
  .item-name-row{display:flex;align-items:center;gap:8px;margin-bottom:0.6rem}
  .item-name-input{flex:1;background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,0.08);color:var(--cream);font-size:1.05rem;font-weight:600;font-family:'Outfit',sans-serif;padding:0.2rem 0;outline:none;transition:border-color 0.2s}
  .item-name-input:focus{border-color:var(--gold)}
  .item-price-input{background:rgba(240,165,0,0.1);border:1px solid rgba(240,165,0,0.2);color:var(--gold);font-size:1rem;font-weight:700;font-family:'Bebas Neue',sans-serif;padding:0.2rem 0.5rem;border-radius:4px;outline:none;width:70px;text-align:center;letter-spacing:0.05em;transition:border-color 0.2s}
  .item-price-input:focus{border-color:var(--gold)}
  .item-desc-input{width:100%;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);color:var(--muted);font-size:0.8rem;font-family:'Outfit',sans-serif;padding:0.6rem 0.8rem;border-radius:6px;outline:none;resize:none;min-height:60px;line-height:1.5;transition:border-color 0.2s;margin-bottom:0.8rem}
  .item-desc-input:focus{border-color:rgba(240,165,0,0.3);color:var(--text)}
  .item-meta-row{display:flex;gap:0.6rem;align-items:center;flex-wrap:wrap}
  .item-select{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);color:var(--text);font-size:0.75rem;font-family:'Outfit',sans-serif;padding:0.35rem 0.6rem;border-radius:5px;outline:none;cursor:pointer;transition:border-color 0.2s}
  .item-select:focus{border-color:var(--gold)}
  .item-select option{background:var(--dark-warm)}
  .item-tag-input{flex:1;min-width:80px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);color:var(--text);font-size:0.75rem;font-family:'Outfit',sans-serif;padding:0.35rem 0.6rem;border-radius:5px;outline:none;transition:border-color 0.2s}
  .item-tag-input:focus{border-color:var(--gold)}

  /* EMPTY STATE */
  .empty-state{text-align:center;padding:4rem 2rem;color:var(--muted);grid-column:1/-1}
  .empty-state span{font-size:3rem;display:block;margin-bottom:1rem}

  /* TOAST */
  .toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(20px);padding:0.8rem 2rem;border-radius:100px;font-size:0.9rem;font-weight:600;opacity:0;transition:all 0.3s;pointer-events:none;z-index:99999;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.success{background:var(--green);color:white}
  .toast.error{background:var(--red);color:white}
  .toast.info{background:var(--gold);color:var(--dark)}

  /* RESPONSIVE */
  @media(max-width:768px){
    .topbar{padding:0 1rem}
    .topbar-logo{font-size:1.3rem}
    .main{padding:1rem}
    .stats-bar{grid-template-columns:1fr 1fr}
    .menu-grid{grid-template-columns:1fr}
    .action-bar{flex-direction:column;align-items:flex-start}
    .topbar-badge{display:none}
  }
  @media(max-width:400px){.stats-bar{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">DJOLIBA</div>
    <div class="login-sub">🇬🇳 Menu Manager · Admin Access</div>
    <input type="password" class="login-input" id="pwInput" placeholder="Enter your password" onkeydown="if(event.key==='Enter')login()">
    <button class="login-btn" onclick="login()">Login →</button>
    <div class="login-error" id="loginError">❌ Incorrect password. Try again.</div>
    <p class="login-hint">Authorized DJOLIBA staff only.</p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:1rem">
      <div class="topbar-logo">DJOLIBA</div>
      <div class="topbar-badge">Menu Manager</div>
    </div>
    <div class="topbar-right">
      <a href="https://djolibarestaurant.net" target="_blank" class="topbar-btn">🌐 View Live Site</a>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="main">
    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat-card"><span class="stat-icon">🍽️</span><div><div class="stat-num" id="statTotal">—</div><div class="stat-label">Total Items</div></div></div>
      <div class="stat-card"><span class="stat-icon">🔥</span><div><div class="stat-num" id="statGrill">—</div><div class="stat-label">Grill & Fryer</div></div></div>
      <div class="stat-card"><span class="stat-icon">🥘</span><div><div class="stat-num" id="statSauces">—</div><div class="stat-label">Sauces & Stews</div></div></div>
      <div class="stat-card"><span class="stat-icon">🥤</span><div><div class="stat-num" id="statDrinks">—</div><div class="stat-label">Drinks</div></div></div>
    </div>

    <!-- Action bar -->
    <div class="action-bar">
      <div class="action-bar-left">
        <h2>Menu Items</h2>
        <div class="cat-filter">
          <button class="cat-btn active" onclick="filterCat('all',this)">All</button>
          <button class="cat-btn" onclick="filterCat('special',this)">⭐ Special</button>
          <button class="cat-btn" onclick="filterCat('grill',this)">🔥 Grill</button>
          <button class="cat-btn" onclick="filterCat('fryer',this)">🍳 Fryer</button>
          <button class="cat-btn" onclick="filterCat('sauces',this)">🥘 Sauces</button>
          <button class="cat-btn" onclick="filterCat('stew',this)">🍲 Stews</button>
          <button class="cat-btn" onclick="filterCat('drinks',this)">🥤 Drinks</button>
        </div>
      </div>
      <div class="action-bar-right">
        <button class="add-btn" onclick="addNewItem()">+ Add Dish</button>
        <button class="save-btn" onclick="saveAll()">💾 Save All</button>
      </div>
    </div>

    <!-- Menu Grid -->
    <div class="menu-grid" id="menuGrid">
      <div class="empty-state"><span>⏳</span>Loading your menu...</div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const ADMIN_PASSWORD = 'Djene@804$!!!';
const SUPABASE_URL = 'https://uzuesheseparsuhbvmaz.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV6dWVzaGVzZXBhcnN1aGJ2bWF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM4MzIxMDMsImV4cCI6MjA4OTQwODEwM30.I9KQRLxyrB9GfmOJSaR4BuALSwpFYlgBQqXzwNmUxjs';
const BUCKET = 'menu-images';

let menuItems = [];
let currentFilter = 'all';

// ── AUTH ────────────────────────────────────────
function login() {
  const pw = document.getElementById('pwInput').value;
  if (pw === ADMIN_PASSWORD) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('loginError').style.display = 'none';
    loadMenu();
  } else {
    document.getElementById('loginError').style.display = 'block';
    document.getElementById('pwInput').value = '';
  }
}

function logout() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('pwInput').value = '';
}

// ── SUPABASE HELPERS ────────────────────────────
const headers = {
  'apikey': SUPABASE_KEY,
  'Authorization': `Bearer ${SUPABASE_KEY}`,
  'Content-Type': 'application/json'
};

async function loadMenu() {
  try {
    showToast('Loading menu...', 'info');
    const res = await fetch(`${SUPABASE_URL}/rest/v1/menu_items?select=*&order=id.asc`, { headers });
    const data = await res.json();
    menuItems = data.map(i => ({
      id: i.id, name: i.name, price: parseFloat(i.price),
      desc: i.description, category: i.category,
      img: i.image_url, tag: i.tag, tagClass: i.tag_class
    }));
    updateStats();
    renderGrid();
    showToast('✅ Menu loaded!', 'success');
  } catch(e) {
    showToast('❌ Failed to load menu', 'error');
  }
}

async function saveAll() {
  showToast('💾 Saving...', 'info');
  let ok = true;
  for (const item of menuItems) {
    const payload = {
      name: item.name, price: item.price,
      description: item.desc, category: item.category,
      image_url: item.img, tag: item.tag, tag_class: item.tagClass
    };
    if (item.id) {
      const r = await fetch(`${SUPABASE_URL}/rest/v1/menu_items?id=eq.${item.id}`, {
        method: 'PATCH', headers: {...headers, 'Prefer': 'return=minimal'},
        body: JSON.stringify(payload)
      });
      if (!r.ok) ok = false;
    } else {
      const r = await fetch(`${SUPABASE_URL}/rest/v1/menu_items`, {
        method: 'POST', headers: {...headers, 'Prefer': 'return=representation'},
        body: JSON.stringify(payload)
      });
      if (r.ok) { const d = await r.json(); item.id = d[0]?.id; }
      else ok = false;
    }
  }
  updateStats();
  showToast(ok ? '✅ All changes saved & live!' : '⚠️ Some items failed', ok ? 'success' : 'error');
}

async function deleteItem(idx) {
  const item = menuItems[idx];
  if (!confirm(`Remove "${item.name}" from menu?`)) return;
  if (item.id) {
    await fetch(`${SUPABASE_URL}/rest/v1/menu_items?id=eq.${item.id}`, {
      method: 'DELETE', headers
    });
  }
  menuItems.splice(idx, 1);
  updateStats(); renderGrid();
  showToast('🗑 Item removed', 'info');
}

// ── IMAGE UPLOAD ────────────────────────────────
async function uploadImage(idx, file) {
  const ext = file.name.split('.').pop();
  const fileName = `dish-${Date.now()}.${ext}`;
  const bar = document.getElementById(`bar${idx}`);

  showToast('📸 Uploading photo...', 'info');
  if (bar) bar.style.width = '30%';

  try {
    // Upload to Supabase Storage
    const uploadRes = await fetch(
      `${SUPABASE_URL}/storage/v1/object/${BUCKET}/${fileName}`,
      {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Content-Type': file.type,
          'Cache-Control': '3600'
        },
        body: file
      }
    );

    if (bar) bar.style.width = '70%';

    if (!uploadRes.ok) {
      const err = await uploadRes.text();
      throw new Error(err);
    }

    // Get public URL
    const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${fileName}`;
    menuItems[idx].img = publicUrl;

    // Update image on card
    const cardImg = document.getElementById(`img${idx}`);
    if (cardImg) cardImg.src = publicUrl;

    if (bar) bar.style.width = '100%';
    setTimeout(() => { if (bar) bar.style.width = '0%'; }, 800);

    showToast('✅ Photo uploaded! Click Save All to go live.', 'success');
  } catch(e) {
    console.error('Upload error:', e);
    if (bar) bar.style.width = '0%';
    showToast('❌ Upload failed. Try again.', 'error');
  }
}

// ── RENDER ──────────────────────────────────────
function renderGrid() {
  const grid = document.getElementById('menuGrid');
  const filtered = currentFilter === 'all' ? menuItems : menuItems.filter(i => i.category === currentFilter);

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty-state"><span>🍽️</span>No items here yet.<br>Click "+ Add Dish" to add one!</div>';
    return;
  }

  grid.innerHTML = filtered.map((item) => {
    const idx = menuItems.indexOf(item);
    return `
    <div class="item-card" id="card${idx}">
      <div class="item-img-area" onclick="document.getElementById('file${idx}').click()">
        <img src="${item.img}" alt="${item.name}" id="img${idx}"
          onerror="this.src='https://via.placeholder.com/340x180/2A1A0A/F0A500?text=Tap+to+Upload'">
        <span class="item-card-cat">${item.category}</span>
        <button class="delete-btn-img" onclick="event.stopPropagation();deleteItem(${idx})">🗑</button>
        <div class="img-overlay">
          <div class="img-overlay-text"><span>📸</span>Tap to change photo</div>
        </div>
        <div class="upload-progress"><div class="upload-progress-bar" id="bar${idx}"></div></div>
      </div>
      <input type="file" accept="image/*" class="file-input" id="file${idx}"
        onchange="uploadImage(${idx}, this.files[0])">
      <div class="item-card-body">
        <div class="item-name-row">
          <input class="item-name-input" type="text" value="${item.name}"
            onchange="menuItems[${idx}].name=this.value" placeholder="Dish name">
          <input class="item-price-input" type="number" value="${item.price}" step="0.50" min="0"
            onchange="menuItems[${idx}].price=parseFloat(this.value)">
        </div>
        <textarea class="item-desc-input"
          onchange="menuItems[${idx}].desc=this.value"
          placeholder="Description...">${item.desc}</textarea>
        <div class="item-meta-row">
          <select class="item-select" onchange="menuItems[${idx}].category=this.value">
            <option value="special" ${item.category==='special'?'selected':''}>⭐ Special</option>
            <option value="grill" ${item.category==='grill'?'selected':''}>🔥 Grill</option>
            <option value="fryer" ${item.category==='fryer'?'selected':''}>🍳 Fryer</option>
            <option value="sauces" ${item.category==='sauces'?'selected':''}>🥘 Sauces</option>
            <option value="stew" ${item.category==='stew'?'selected':''}>🍲 Stew</option>
            <option value="drinks" ${item.category==='drinks'?'selected':''}>🥤 Drinks</option>
          </select>
          <input class="item-tag-input" type="text" value="${item.tag}"
            onchange="menuItems[${idx}].tag=this.value" placeholder="Badge">
          <select class="item-select" onchange="menuItems[${idx}].tagClass=this.value">
            <option value="" ${item.tagClass===''?'selected':''}>🔴 Red</option>
            <option value="halal" ${item.tagClass==='halal'?'selected':''}>🟢 Green</option>
            <option value="special" ${item.tagClass==='special'?'selected':''}>🟡 Gold</option>
          </select>
        </div>
      </div>
    </div>`;
  }).join('');
}

function filterCat(cat, btn) {
  currentFilter = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderGrid();
}

function addNewItem() {
  menuItems.unshift({
    id: null, name: 'New Dish', price: 0.00,
    desc: 'Enter a description for this dish.',
    category: currentFilter === 'all' ? 'grill' : currentFilter,
    img: 'https://via.placeholder.com/340x180/2A1A0A/F0A500?text=Tap+to+Upload+Photo',
    tag: 'New', tagClass: ''
  });
  currentFilter = 'all';
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.cat-btn').classList.add('active');
  renderGrid();
  document.getElementById('menuGrid').firstElementChild.scrollIntoView({behavior:'smooth'});
  showToast('✅ New dish added!', 'success');
}

function updateStats() {
  document.getElementById('statTotal').textContent = menuItems.length;
  document.getElementById('statGrill').textContent = menuItems.filter(i=>i.category==='grill'||i.category==='fryer').length;
  document.getElementById('statSauces').textContent = menuItems.filter(i=>i.category==='sauces'||i.category==='stew').length;
  document.getElementById('statDrinks').textContent = menuItems.filter(i=>i.category==='drinks').length;
}

function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
</body>
</html>
